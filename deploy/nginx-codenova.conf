# 把这两个 location 块加进监听 127.0.0.1:18080 的现有 server 块里。
# 想换成别的前缀，把下面所有 /codenova 一起替换即可。
location = /codenova {
    return 302 /codenova/;
}

location /codenova/ {
    proxy_pass http://127.0.0.1:18083/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /codenova;

    # 前端要下载 8MB 的 pyodide.asm.wasm，开启压缩能显著加快首次加载。
    # 若 server 块里已经有 gzip 配置，只需补上 application/wasm 这一项：
    # gzip on;
    # gzip_types text/css application/javascript application/wasm;
    gzip_static off;
}
